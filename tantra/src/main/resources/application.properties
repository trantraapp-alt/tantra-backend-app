spring.application.name=tantra


# ? PostgreSQL Connection Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/tantra_db
spring.datasource.username=postgres
spring.datasource.password=pgAdmin

# ?? Hibernate & DDL Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging: include the request traceId in every log line (correlate with X-Trace-Id header).
# For production JSON logs, set env LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs (Spring Boot native, no dependency).
logging.pattern.level=%5p [trace=%X{traceId:-}]

# Storage backend: "local" (dev, disk) or "r2" (prod, Cloudflare R2). Default = local.
app.storage.type=local

# File uploads for local storage (served at /files/**)
app.upload.dir=D:/TANTRA/Tantra_Backend/tantra/uploads
app.upload.base-url=/files
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

# --- Cloudflare R2 (only used when app.storage.type=r2). Prefer env vars, do not commit real keys. ---
# app.storage.r2.endpoint=https://<account-id>.r2.cloudflarestorage.com
# app.storage.r2.bucket=tantra-listings
# app.storage.r2.access-key=${R2_ACCESS_KEY}
# app.storage.r2.secret-key=${R2_SECRET_KEY}
# app.storage.r2.public-base-url=https://cdn.tantra.app

# ─── JWT Configuration ─────────────────────────────────────────────────────────
# DEV default — safe to commit. In production set JWT_SECRET env var (min 32 chars).
app.jwt.secret=${JWT_SECRET:7f3c8b2a1e4d6f9a8c7b6a5e4d3c2b1a0f9e8d7c6b5a4f3e2d1c0b9a8f7e6d5c}

# ─── Payment Configuration ─────────────────────────────────────────────────────
# true  = LOCAL/TEST mode — no real money, mock order + instant verify (default)
# false = PRODUCTION — requires Razorpay keys below to be set
app.payment.test-mode=true

# ─── FCM Push Notifications ────────────────────────────────────────────────────
# false = local/dev (push calls are no-ops, logged at DEBUG)
# true  = production FCM (requires firebase-service-account.json on classpath + firebase-admin in pom.xml)
app.fcm.enabled=false
# Place your Firebase service account JSON at: src/main/resources/firebase-service-account.json
# (add to .gitignore — contains private key)

# --- Razorpay (production only) — set app.payment.test-mode=false to activate ---
# Get keys from: https://dashboard.razorpay.com/app/keys
# Use rzp_test_* keys for Razorpay sandbox testing (still requires test-mode=false)
# app.payment.razorpay.key-id=${RAZORPAY_KEY_ID}
# app.payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET}
# app.payment.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET}
